# Nginx global — process uid 101 (image nginx-unprivileged).
# Pas de directive `user` : elle échouerait (on n’est déjà pas root).
worker_processes auto;
error_log /dev/stderr warn;
# Rootfs read-only : pid et fichiers temporaires uniquement sous /tmp (tmpfs).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Reçus PDF / JSON POS : 10 Mo suffit (pas d’upload photo MVP).
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS interne Docker : `proxy_pass $upstream_app` re-résout `app` si le conteneur change.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Fichier généré par docker-entrypoint.sh (http.conf vs https.conf).
    include /tmp/nginx-conf/*.conf;
}
