name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dubai_phone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dubai_phone?schema=public
      SEED_USER_PASSWORD: CiTestPassw0rd!

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python microservices
        working-directory: services
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: Dubai Phone
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Docker Compose images
        env:
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@db:5432/dubai_phone?schema=public
        run: docker compose build

  target:
    name: Select EC2 environment
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      env_name: ${{ steps.select.outputs.env_name }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -eu
          deploy=false
          env_name=
          sha=

          map_env() {
            case "$1" in
              dev) echo dev ;;
              prod) echo prod ;;
              *) echo "" ;;
            esac
          }

          # Merge (push) ou Run workflow : uniquement depuis la branche dev|prod.
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then
            env_name="$(map_env "$REF_NAME")"
            if [ -n "$env_name" ]; then
              sha="$PUSH_SHA"
              deploy=true
            else
              echo "skip: déclencher depuis la branche dev ou prod (actuel: ${REF_NAME})"
            fi
          else
            echo "skip: ${EVENT} ne déploie pas (CI only)"
          fi

          {
            echo "deploy=${deploy}"
            echo "env_name=${env_name}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy} env=${env_name} sha=${sha}"

  deploy:
    name: Deploy ${{ needs.target.outputs.env_name }}
    needs: [quality, target]
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env_name }}
    concurrency:
      group: dubai-phone-${{ needs.target.outputs.env_name }}
      cancel-in-progress: false
    steps:
      - name: Check GitHub Environment config
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -eu
          env_name='${{ needs.target.outputs.env_name }}'
          : "${EC2_HOST:?missing vars.EC2_HOST on GitHub Environment ${env_name}}"
          echo "env=${env_name} host=${EC2_HOST} user=${EC2_USER:-ubuntu}"

      - name: Release on EC2 (${{ needs.target.outputs.env_name }})
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ vars.EC2_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -eu
            DEPLOY_PATH='${{ vars.EC2_DEPLOY_PATH || '/opt/dubai-phone' }}'
            DEPLOY_SHA='${{ needs.target.outputs.sha }}'
            cd "$DEPLOY_PATH"
            git fetch origin --prune
            git fetch origin "$DEPLOY_SHA" 2>/dev/null || true
            git reset --hard "$DEPLOY_SHA"
            exec ./deploy/ec2-release.sh
