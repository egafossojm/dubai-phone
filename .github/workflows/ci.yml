name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dubai_phone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dubai_phone?schema=public
      SEED_USER_PASSWORD: CiTestPassw0rd!

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: Dubai Phone
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Docker Compose images
        env:
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@db:5432/dubai_phone?schema=public
        run: docker compose build
