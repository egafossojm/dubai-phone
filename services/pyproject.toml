[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dubai-phone-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.2",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["dubai_shared*", "identity_service*", "catalog_service*", "reporting_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
