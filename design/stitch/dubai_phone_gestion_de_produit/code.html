<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Créer / Modifier un Produit - Dubai Phone</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-primary": "#b3c5ff",
                        "surface-dim": "#d2d9f4",
                        "on-secondary-container": "#00714d",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#6cf8bb",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#002113",
                        "outline-variant": "#c2c6d8",
                        "secondary-fixed": "#6ffbbe",
                        "on-background": "#131b2e",
                        "on-tertiary-fixed-variant": "#653e00",
                        "background": "#faf8ff",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#fff7f1",
                        "surface-bright": "#faf8ff",
                        "tertiary-container": "#a06500",
                        "primary": "#0050cb",
                        "on-surface-variant": "#424656",
                        "on-primary-fixed": "#001849",
                        "primary-fixed": "#dae1ff",
                        "tertiary-fixed": "#ffddb8",
                        "secondary": "#006c49",
                        "on-primary-container": "#f8f7ff",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container": "#eaedff",
                        "surface-container-high": "#e2e7ff",
                        "outline": "#727687",
                        "inverse-on-surface": "#eef0ff",
                        "surface-container-highest": "#dae2fd",
                        "on-error": "#ffffff",
                        "surface": "#faf8ff",
                        "on-primary-fixed-variant": "#003fa4",
                        "surface-variant": "#dae2fd",
                        "surface-tint": "#0054d6",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container-low": "#f2f3ff",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#283044",
                        "primary-container": "#0066ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-surface": "#131b2e",
                        "primary-fixed-dim": "#b3c5ff",
                        "tertiary": "#7f4f00",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "card-padding": "20px",
                        "base": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 80, 203, 0.05);
        }
        
        .input-glow:focus {
            box-shadow: 0 0 0 4px rgba(0, 80, 203, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md">
<!-- SideNavBar (Suppressed as this is a focused task/transactional page: Creating/Editing a product) -->
<!-- TopNavBar (Suppressed to prioritize the form canvas, but keeping a simplified task header) -->
<header class="bg-surface-container-lowest/80 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/30 px-container-margin py-4 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-4">
<button aria-label="Retour" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full p-2 hover:bg-surface-container-low">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Créer / Modifier un Produit</h1>
</div>
<div class="flex gap-4 hidden md:flex">
<button class="px-6 py-2 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors font-label-md text-label-md">Annuler</button>
<button class="px-6 py-2 rounded-full bg-primary text-on-primary hover:bg-primary/90 transition-colors shadow-md shadow-primary/20 font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">save</span>
                 Enregistrer
             </button>
</div>
</header>
<main class="max-w-5xl mx-auto px-container-margin py-8 md:py-12 pb-32 md:pb-12">
<form class="space-y-8">
<!-- Basic Info Section -->
<section class="glass-card rounded-xl p-card-padding">
<div class="flex items-center gap-3 mb-6 border-b border-outline-variant/20 pb-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined">info</span>
</div>
<h2 class="font-headline-md text-headline-md">Informations Générales</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-2 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="productName">Nom du Produit *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md" id="productName" placeholder="Ex: Samsung Galaxy S23 Ultra" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="brand">Marque *</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md pr-10" id="brand">
<option disabled="" selected="" value="">Sélectionner une marque</option>
<option value="samsung">Samsung</option>
<option value="apple">Apple</option>
<option value="xiaomi">Xiaomi</option>
<option value="tecno">Tecno</option>
<option value="infinix">Infinix</option>
<option value="bafang">Bafang</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="category">Catégorie *</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md pr-10" id="category">
<option disabled="" selected="" value="">Sélectionner une catégorie</option>
<option value="smartphones">Smartphones</option>
<option value="tablets">Tablettes</option>
<option value="accessories">Accessoires</option>
<option value="laptops">Ordinateurs Portables</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-2 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="description">Description (Optionnel)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md resize-y" id="description" placeholder="Description courte du produit..." rows="3"></textarea>
</div>
</div>
</section>
<!-- Pricing Section -->
<section class="glass-card rounded-xl p-card-padding">
<div class="flex items-center gap-3 mb-6 border-b border-outline-variant/20 pb-4">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined">payments</span>
</div>
<h2 class="font-headline-md text-headline-md">Tarification</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="costPrice">Coût d'Achat (FCFA) *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">money</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md" id="costPrice" placeholder="0" type="number"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="sellingPrice">Prix de Vente (FCFA) *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">sell</span>
<input class="w-full bg-surface-container-lowest border border-primary/50 rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md shadow-[0_0_10px_rgba(0,80,203,0.05)]" id="sellingPrice" placeholder="0" type="number"/>
</div>
<p class="font-label-sm text-label-sm text-secondary mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">trending_up</span>
                            Marge estimée: --%
                        </p>
</div>
</div>
</section>
<!-- Inventory Policy -->
<section class="glass-card rounded-xl p-card-padding">
<div class="flex items-center gap-3 mb-6 border-b border-outline-variant/20 pb-4">
<div class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined">inventory_2</span>
</div>
<h2 class="font-headline-md text-headline-md">Politique d'Inventaire</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Policy Selection -->
<div class="space-y-4">
<label class="flex items-start gap-4 p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<div class="flex items-center h-6">
<input checked="" class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="inventoryPolicy" type="radio" value="standard"/>
</div>
<div>
<span class="block font-body-md text-body-md font-semibold text-on-surface mb-1">Standard (Quantité)</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Gérer le stock par quantité globale. Idéal pour les accessoires.</span>
</div>
</label>
<label class="flex items-start gap-4 p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<div class="flex items-center h-6">
<input class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="inventoryPolicy" type="radio" value="serialized"/>
</div>
<div>
<span class="block font-body-md text-body-md font-semibold text-on-surface mb-1">Sérialisé (IMEI / S/N)</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Suivi individuel de chaque unité par numéro de série. Requis pour les téléphones.</span>
</div>
</label>
</div>
<!-- Alerts & Stock -->
<div class="space-y-4">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="initialStock">Stock Initial</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md" id="initialStock" placeholder="0" type="number"/>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="lowStockAlert">Alerte Stock Faible</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary input-glow transition-all font-body-md text-body-md" id="lowStockAlert" placeholder="5" type="number"/>
</div>
</div>
</div>
</section>
</form>
</main>
<!-- Mobile Fixed Action Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-surface-container-lowest border-t border-outline-variant/30 p-4 flex gap-4 md:hidden z-50 pb-safe">
<button class="flex-1 py-3 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors font-label-md text-label-md text-center">Annuler</button>
<button class="flex-1 py-3 rounded-full bg-primary text-on-primary hover:bg-primary/90 transition-colors shadow-md shadow-primary/20 font-label-md text-label-md text-center">Enregistrer</button>
</div>
</body></html>
