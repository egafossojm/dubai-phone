# Dubai Phone — prod MVP : EC2 + Compose (app, Postgres, Nginx, Certbot).
# Aucun service ne tourne en root. Nginx/Certbot = uid 101.
# Doc : docs/ops/01-deployment.md et docs/ops/08-nginx.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dubai_phone}
    # Dump d’urgence depuis l’hôte uniquement — fermer 5432 dans le security group AWS.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dubai_phone_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dubai_phone}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ./services
    command: uvicorn identity_service.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    expose:
      - "8000"
    environment: &python-env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NODE_ENV: production
      TRUSTED_PROXY: ${TRUSTED_PROXY:-1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  catalog:
    build:
      context: ./services
    command: uvicorn catalog_service.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      <<: *python-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  reporting:
    build:
      context: ./services
    command: uvicorn reporting_service.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      <<: *python-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* sont bakeés au build : reconstruire si l’URL HTTPS change.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dubai Phone}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    restart: unless-stopped
    # Pas de ports hôte : seul Nginx est public (sinon on contourne TLS / TRUSTED_PROXY).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dubai Phone}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-1}
      RUN_MIGRATE_ON_START: ${RUN_MIGRATE_ON_START:-1}
      IDENTITY_URL: http://identity:8000
      CATALOG_URL: http://catalog:8000
      REPORTING_URL: http://reporting:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      reporting:
        condition: service_healthy

  nginx:
    build: ./deploy/nginx
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Image : 8080/8443. Hôte : 80/443 (Let’s Encrypt HTTP-01 a besoin du 80 public).
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_HTTPS_PORT:-443}:8443"
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-localhost}
    volumes:
      - letsencrypt:/data:ro
      - acme-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started

  certbot:
    build: ./deploy/certbot
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Vides en local = pas d’appel à l’API Let’s Encrypt (boucle d’attente).
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - letsencrypt:/data
      - acme-www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  dubai_phone_pg:
  letsencrypt:
  acme-www:
